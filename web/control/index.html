<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LowSight Control</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .row > label { min-width: 110px; color: #aaa; }
    button, select { font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; cursor: pointer; }
    button.on { background: #2a6; border-color: #2a6; color: #000; }
    .readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 10px; padding: 10px; }
    .card b { display: block; font-size: 26px; margin-top: 4px; }
    #log { background: #000; border: 1px solid #333; border-radius: 8px; padding: 8px; height: 180px; overflow: auto; font: 13px ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>LowSight — demo control</h1>
  <div class="row"><label>Scenario</label><select id="scenario"></select><button id="reset">Reset</button></div>
  <div class="row"><label>Clock</label>
    <button id="pause">Pause</button><button id="play">Play</button>
    <span data-group="speed"><button data-v="1">1×</button><button data-v="10">10×</button><button data-v="30">30×</button><button data-v="60">60×</button></span>
    <button id="jump">Jump to −5 min before crossing</button>
  </div>
  <div class="row"><label>Force driving</label>
    <span data-group="force"><button data-v="on">On</button><button data-v="off">Off</button><button data-v="auto">Auto</button></span>
  </div>
  <div class="row"><label>Units</label>
    <span data-group="units"><button data-v="mmol">mmol/L</button><button data-v="mgdl">mg/dL</button></span>
  </div>
  <div class="readout">
    <div class="card">Glucose<b id="r-value">--</b></div>
    <div class="card">Trend<b id="r-trend">--</b></div>
    <div class="card">+30 min<b id="r-fc">--</b></div>
    <div class="card">p_driver<b id="r-p">--</b></div>
    <div class="card">Driving<b id="r-drv">--</b></div>
    <div class="card">Alert<b id="r-alert">--</b></div>
    <div class="card">Demo time<b id="r-time">--</b></div>
  </div>
  <div id="log"></div>
  <script src="control.js"></script>
</body>
</html>
