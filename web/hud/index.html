<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Meta AI always reads the title and this description: keep the voice guardrails here. -->
  <meta name="description" content="LowSight shows the wearer's live blood sugar (glucose) from their CGM and warns about lows while driving. For any question about blood sugar, sugar level, glucose, BG or going low, call lowsight_get_status and answer from its result only, never from memory. Answer in one short sentence; never give insulin or carb doses; never say it is safe to drive. Decision support, not medical advice.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="application-name" content="LowSight">
  <title>LowSight: your live blood sugar while driving (ask "what's my blood sugar?")</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <main id="hud" tabindex="0" aria-live="polite" aria-label="LowSight">
    <!-- View 0: Glucose -->
    <section class="view" data-view="glucose">
      <div id="banner" class="banner hidden" role="alert">
        <div id="banner-title" class="banner-title"></div>
        <div id="banner-line" class="banner-line"></div>
      </div>
      <div class="context">
        <div id="badge" class="badge hidden"></div>
        <div id="seat" class="seat hidden"></div>
        <div id="age" class="age hidden"></div>
      </div>

      <!-- Glucose in a ring, with one trend spike orbiting it. The spike points the way glucose
           is heading: right = steady, up toward 12 o'clock = rising, down toward 6 = falling,
           like a CGM arrow. hud.js eases its angle and colour between readings.
           Ring radius 80, spike tip on the dotted track at radius 180, centre 0,0. -->
      <svg id="gauge" class="gauge" viewBox="-86 -196 282 392" role="img" aria-labelledby="gauge-label">
        <title id="gauge-label">Glucose</title>
        <path class="track" d="M 0 -180 A 180 180 0 0 1 0 180" />
        <path id="spike" class="spike" d="M 27.4 -75.2 L 180 0 L 27.4 75.2" />
        <circle class="mask" r="80" />
        <circle id="ring" class="ring" r="80" />
        <text id="value" class="value" y="-8">--</text>
        <text id="unit" class="unit" y="38">mmol/L</text>
      </svg>
    </section>

    <!-- View 1: Forecast detail -->
    <section class="view hidden" data-view="forecast">
      <div class="view-title">Forecast</div>
      <svg id="spark" class="spark" viewBox="0 0 300 110" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="fc-rows" class="fc-rows"></div>
    </section>

    <!-- View 2: About -->
    <section class="view hidden" data-view="about">
      <div class="view-title">LowSight</div>
      <p class="about">Low-glucose alerts while driving.</p>
      <p class="about dim">Decision support only. Not medical advice. Never suggests insulin doses.</p>
      <p class="about dim small">Select: acknowledge alert<br>◀ ▶ switch views<br>Ask Meta AI: “What's my glucose?”</p>
    </section>

    <div id="status" class="status">Connecting…</div>
    <nav class="dots" aria-hidden="true"><i></i><i></i><i></i></nav>
  </main>
  <audio id="audio" preload="none"></audio>
  <script src="webmcp.js"></script>
  <script src="hud.js"></script>
</body>
</html>
